name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci_project
          mkdir -p .ci_project

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'lumen_hardened_build_v3.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: lumen_hardened_build_v3.zip is missing from repository root."
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d .ci_project
          PROJECT_DIR="$(find .ci_project -type f -name pubspec.yaml -print -quit | xargs -r dirname)"

          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/pubspec.yaml"
          test -d "$PROJECT_DIR/android"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using Flutter project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Download Xray runtime
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: v26.9.9
          fileName: libv2ray.aar
          out-file-path: ${{ env.PROJECT_DIR }}/android/app/libs

      - name: Verify Xray runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PROJECT_DIR/android/app/libs/libv2ray.aar"
          unzip -t "$PROJECT_DIR/android/app/libs/libv2ray.aar" >/dev/null

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Check Flutter Android embedding
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android:name="flutterEmbedding" android:value="2"' android/app/src/main/AndroidManifest.xml
          if grep -R -nE 'io\.flutter\.app\.|PluginRegistry\.Registrar|ShimRegistrar' android --include='*.kt' --include='*.java'; then
            echo 'ERROR: Old Flutter Android v1 embedding detected.'
            exit 1
          fi

      - name: Prepare Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          cd android
          gradle wrapper --gradle-version 8.14 --distribution-type bin
          chmod +x gradlew

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumen-release-v0.1.0-2
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
